# Versions resolved from the live repositories on 2026-11-23, not from memory.
#
# There is no AndroidX here on purpose. The Host's native core uses the platform
# directly, and its screens are a web bundle (DECISIONS D19), so nothing ties
# this build to an AndroidX generation.
[versions]
agp = "9.5.2"

[libraries]
# HPKE (RFC 9180). The platform has no X25519 before API 33 and the Host
# supports 26, so the suite has to come from a library.
tink-android = { module = "com.google.crypto.tink:tink-android", version = "1.24.0" }
junit = { module = "junit:junit", version = "4.13.2" }
# Real org.json for unit tests. The android.jar stub throws "not mocked" on
# every method, so any code path touching JSON is untestable without it.
json = { module = "org.json:json", version = "20260814" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
