name: build

# Every APK anyone installs comes from here (DECISIONS D20). A tag named v*
# publishes a GitHub Release; every other push proves the build and keeps the
# signed APK as a run artifact.
on:
  push:
    branches: [dev, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The suite encodes docs/THREAT-MODEL.md. A change that quietly breaks one
      # of its rules fails here.
      - run: npm test

  host:
    runs-on: ubuntu-latest
    env:
      EASYOTP_VERSION_CODE: ${{ github.run_number }}
      EASYOTP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.{0}-{1}', github.run_number, github.sha) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already carries an Android SDK. Accepting the licences
      # is all Gradle needs to fetch whatever platform or build tools it lacks.
      - name: Accept SDK licences
        run: yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # EASYOTP_MIRRORS is never set here: a published APK resolves from Google
      # and Maven Central directly, never through a third-party mirror (D11).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # The committed fixtures only prove that whatever wrote them interoperates.
      # Regenerating them here and opening them with the bridge's own suite is
      # what makes a change to either side's sealing fail in CI instead of in
      # the field, where it shows up as every message silently rejected.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Wire contracts against fresh fixtures
        run: |
          set -euo pipefail
          cp app/build/interop/hpke-fixture.json worker/test/hpke-fixture.json
          cp app/build/interop/ids-fixture.json worker/test/ids-fixture.json
          cd worker
          npm ci
          npx vitest run test/interop.spec.ts

      # Pull requests from forks get no secrets, so they stop at the tests.
      - name: Restore the release key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.EASYOTP_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf %s "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "EASYOTP_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Signed release APK
        if: steps.key.outputs.present == 'true'
        env:
          EASYOTP_KEYSTORE_PASSWORD: ${{ secrets.EASYOTP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk easyotp-host.apk
          # A release that is not signed with the one key every installed phone
          # trusts must never leave this job.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs easyotp-host.apk | tee certs.txt
          grep -qi "SHA-256 digest: fa735cec0267e066611ce1afa31c50e661d0fb8b51d6ed2e39a5e8fb066bbc5a" certs.txt
          sha256sum easyotp-host.apk | tee easyotp-host.apk.sha256

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: easyotp-host
          path: |
            easyotp-host.apk
            easyotp-host.apk.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bridge, host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easyotp-host
      # Asset names are a contract: dl.amirsalmani.com serves the asset called
      # easyotp-host.apk from the latest release.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" easyotp-host.apk easyotp-host.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
